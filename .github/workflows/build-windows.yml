name: Build IdraisCAM Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows runner
        shell: pwsh
        run: Write-Host "IdraisCAM Windows build runner ready"

